name: unison-runtime
github: unisonweb/unison
copyright: Copyright (C) 2013-2024 Unison Computing, PBC and contributors

ghc-options: -fmax-worker-args=100 -Wall -funbox-strict-fields -O2

flags:
  arraychecks:
    manual: true
    default: false
  stackchecks:
    manual: true
    default: false

  # Run optimization assertion tests, make sure this runs with O2
  optchecks:
    manual: true
    default: false

  # Run code through the serializer to test code loading as if it were
  # remote.
  codeserialchecks:
    manual: true
    default: false

  # Dumps core for debugging to unison-runtime/.stack-work/dist/<arch>/ghc-x.y.z/build/
  dumpcore:
    manual: true
    default: false

  # Build the JIT (see docs/jit-design.md). Needs LLVM; its paths are in stack.yaml.
  # Off by default so that nobody else needs LLVM installed.
  jit:
    manual: true
    default: false

when:
  - condition: flag(arraychecks)
    cpp-options: -DARRAY_CHECK
  - condition: flag(stackchecks)
    cpp-options: -DSTACK_CHECK
  - condition: flag(optchecks)
    ghc-options: -O2
    cpp-options: -DOPT_CHECK
    dependencies:
      - inspection-testing
  - condition: flag(codeserialchecks)
    ghc-options: -DCODE_SERIAL_CHECK
  - condition: flag(dumpcore)
    ghc-options: -ddump-simpl -ddump-stg-final -ddump-to-file -dsuppress-coercions -dsuppress-idinfo -dsuppress-module-prefixes -ddump-str-signatures -ddump-simpl-stats # -dsuppress-type-applications -dsuppress-type-signatures
  - condition: flag(jit)
    cpp-options: -DUNISON_JIT
    c-sources:
      - cbits/jit_llvm.c
      - cbits/jit_rt.c
    extra-libraries:
      - LLVM
    # so the binary finds LLVM's shared library at run time without DYLD/LD settings
    ld-options: -Wl,-rpath,/opt/homebrew/opt/llvm/lib

library:
  source-dirs: src
  when:
    - condition: false
      other-modules: Paths_unison_runtime

  c-sources:
    - cbits/i2d.c

  dependencies:
    - asn1-encoding
    - asn1-types
    - atomic-primops
    - avro
    - base
    - binary
    - bytes
    - bytestring
    - clock
    - containers >= 0.6.3
    - crypton
    - data-default
    - data-memocombinators
    - deepseq
    - directory
    - exceptions
    - filepath
    - hashable
    - iproute
    - lens
    - libffi
    - memory
    - mmorph
    - mtl
    - murmur-hash
    - network
    - network-simple
    - network-udp
    - pem
    - primitive
    - process
    - raw-strings-qq
    - safe-exceptions
    - stm
    - tagged
    - temporary
    - text
    - template-haskell
    - inspection-testing
    - time
    - tls
    - unison-codebase-sqlite
    - unison-core
    - unison-core1
    - unison-dynlib
    - unison-hash
    - unison-parser-typechecker
    - unison-prelude
    - unison-pretty-printer
    - unison-syntax
    - unison-util-bytes
    - unison-util-recursion
    - unison-util-rope
    - unliftio
    - unordered-containers
    - vector
    - crypton-x509
    - crypton-x509-store
    - crypton-x509-system
    - crypton-x509-validation

tests:
  runtime-tests:
    source-dirs: tests
    main: Suite.hs
    ghc-options: -W -threaded -rtsopts "-with-rtsopts=-N -T" -v0
    when:
      - condition: false
        other-modules: Paths_unison_parser_typechecker
    dependencies:
      - base
      - bytestring
      - code-page
      - containers
      - crypton
      - directory
      - easytest
      - hedgehog
      - filemanip
      - filepath
      - hex-text
      - lens
      - megaparsec
      - mtl
      - primitive
      - process
      - stm
      - text
      - unison-core1
      - unison-hash
      - unison-util-bytes
      - unison-parser-typechecker
      - unison-prelude
      - unison-pretty-printer
      - unison-runtime
      - unison-syntax

default-extensions:
  - ApplicativeDo
  - BangPatterns
  - BlockArguments
  - DeriveAnyClass
  - DeriveFunctor
  - DeriveGeneric
  - DeriveTraversable
  - DerivingStrategies
  - DerivingVia
  - DoAndIfThenElse
  - DuplicateRecordFields
  - FlexibleContexts
  - FlexibleInstances
  - GeneralizedNewtypeDeriving
  - ImportQualifiedPost
  - LambdaCase
  - MultiParamTypeClasses
  - NamedFieldPuns
  - OverloadedLabels
  - OverloadedRecordDot
  - OverloadedStrings
  - PatternSynonyms
  - RankNTypes
  - ScopedTypeVariables
  - StandaloneDeriving
  - TupleSections
  - TypeApplications
  - TypeFamilies
  - ViewPatterns
